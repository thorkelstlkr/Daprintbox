<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libreta Maker</title>
  <meta name="description" content="Stock, costes y ventas de impresión 3D, láser y sellos.">
  <meta name="theme-color" content="#74af27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Libreta Maker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="masthead">
    <h1><img src="img/cabecera.png" alt="Libreta Maker" width="1297" height="218"></h1>
  </header>
  <div class="topbar">
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-view="dashboard">Resumen</button>
      <button role="tab" data-view="prints">Trabajos</button>
      <button role="tab" data-view="sales">Ventas</button>
      <button role="tab" data-view="expenses">Gastos</button>
      <button role="tab" data-view="filaments">Filamento y resina</button>
      <button role="tab" data-view="materials">Materiales</button>
      <button role="tab" data-view="components">Componentes</button>
      <button role="tab" data-view="printers">Máquinas</button>
      <button role="tab" data-view="settings">Ajustes</button>
    </nav>
  </div>

  <main id="view" tabindex="-1"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>
      <div id="modal-body"></div>
      <footer class="modal-foot">
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary" id="modal-submit">Guardar</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/merge.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
